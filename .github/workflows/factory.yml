name: factory
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'factory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: factory/issue-${{ github.event.issue.number }}-${{ github.run_id }}
    steps:
      - name: Set output dir
        run: echo "OUT_DIR=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project deps
        run: |
          pip install -r requirements/requirements.txt -r requirements/requirements-tests.txt
          pip install -e .
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Write spec
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p "$OUT_DIR"
          printf '# %s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > "$OUT_DIR/spec.md"
      - name: Run factory
        id: factory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: python factory/orchestrate.py "$OUT_DIR/spec.md"
      - name: Commit, push, open PR
        if: steps.factory.outputs.status == 'passed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "factory: implement #$ISSUE_NUM"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          { cat "$OUT_DIR/summary.md"; echo; echo "Closes #$ISSUE_NUM"; } > "$OUT_DIR/pr_body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "factory: issue #$ISSUE_NUM" --body-file "$OUT_DIR/pr_body.md"
      - name: Escalate to human
        if: steps.factory.outputs.status != 'passed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --add-label needs-human
          gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --body-file "$OUT_DIR/summary.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-run-${{ github.run_id }}
          path: ${{ runner.temp }}/factory